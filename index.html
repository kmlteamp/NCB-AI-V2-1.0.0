<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NCB AI_SOS 1.0</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #0f0f12; color: #e6e6e6;
    height: 100vh; display: flex; flex-direction: column;
  }

  /* ===== MÀN HÌNH PIN ===== */
  #pinGate {
    position: fixed; inset: 0; background: #0f0f12;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100; padding: 24px; text-align: center;
  }
  #pinGate h2 { font-size: 20px; color: #f55036; margin-bottom: 8px; }
  #pinGate p { font-size: 13px; color: #888; margin-bottom: 20px; line-height: 1.6; max-width: 340px; }
  #pinInput {
    width: 220px; text-align: center; font-size: 28px; letter-spacing: 12px;
    padding: 12px; background: #17171c; border: 1px solid #333;
    border-radius: 8px; color: #e6e6e6; outline: none; font-family: monospace;
  }
  #pinInput:focus { border-color: #f55036; }
  #pinBtn {
    margin-top: 16px; padding: 12px 32px; background: #f55036; color: #fff;
    border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px;
  }
  #pinBtn:hover { background: #d63e26; }
  #pinMsg { margin-top: 14px; font-size: 13px; min-height: 20px; color: #ff9b9b; }

  /* ===== HEADER ===== */
  header {
    padding: 12px 20px; background: #17171c;
    border-bottom: 1px solid #2a2a33;
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 10px;
  }
  .brand { display: flex; flex-direction: column; gap: 2px; }
  .brand h1 { font-size: 16px; font-weight: 700; color: #f55036; letter-spacing: 0.5px; }
  .brand span { font-size: 11px; color: #777; }
  .brand span a { color: #8ab4f8; text-decoration: none; }
  .brand span a:hover { text-decoration: underline; }
  .header-controls { display: flex; gap: 8px; align-items: center; }
  .hbtn {
    background: transparent; border: 1px solid #444; color: #bbb;
    padding: 6px 12px; border-radius: 6px; cursor: pointer;
    font-size: 13px; font-family: inherit;
  }
  .hbtn:hover { border-color: #f55036; color: #f55036; }

  /* ===== CHAT ===== */
  #chat {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .msg {
    max-width: 80%; padding: 12px 16px; border-radius: 12px;
    line-height: 1.6; font-size: 14px; white-space: pre-wrap;
    word-wrap: break-word;
  }
  .user { align-self: flex-end; background: #1f3a5f; color: #dbeafe; border-bottom-right-radius: 3px; }
  .bot  { align-self: flex-start; background: #1e1e26; border-bottom-left-radius: 3px; }
  .error { align-self: flex-start; background: #3a1f1f; color: #ff9b9b; border-bottom-left-radius: 3px; }
  .typing { color: #888; font-style: italic; font-size: 13px; }
  .speak-btn {
    background: transparent; border: 1px solid #3a3a44; color: #f55036;
    border-radius: 4px; padding: 3px 8px; font-size: 11px;
    cursor: pointer; margin-top: 8px;
  }
  .speak-btn:hover { background: #2a2a33; }

  /* ===== INPUT BAR ===== */
  #inputBar {
    display: flex; gap: 10px; padding: 14px 20px;
    background: #17171c; border-top: 1px solid #2a2a33;
    align-items: flex-end;
  }
  #moodSelect {
    padding: 12px 10px; background: #0f0f12; border: 1px solid #333;
    border-radius: 8px; color: #e6e6e6; font-size: 14px;
    outline: none; cursor: pointer; min-width: 110px; font-family: inherit;
  }
  #moodSelect:focus { border-color: #f55036; }
  #input {
    flex: 1; padding: 12px 14px; background: #0f0f12;
    border: 1px solid #333; border-radius: 8px; color: #e6e6e6;
    font-size: 14px; font-family: inherit; resize: none; outline: none;
    min-height: 44px; max-height: 140px;
  }
  #input:focus { border-color: #f55036; }
  #sendBtn {
    padding: 0 22px; height: 44px; background: #f55036; color: #fff;
    border: none; border-radius: 8px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  #sendBtn:disabled { background: #444; color: #888; cursor: not-allowed; }

  footer {
    padding: 8px 20px; text-align: center; font-size: 11px;
    color: #555; background: #0f0f12; border-top: 1px solid #1e1e26;
  }
  footer a { color: #8ab4f8; text-decoration: none; }
</style>
</head>
<body>

<!-- ===== MÀN HÌNH PIN ===== -->
<div id="pinGate">
  <h2>NCB AI_SOS 1.0</h2>
  <p>Nhập mã PIN 6 chữ số để bảo vệ cuộc trò chuyện.<br>
     Lần đầu: nhập 6 số để đặt PIN.<br>
     Lần sau: nhập đúng PIN để khôi phục trò chuyện.</p>
  <input id="pinInput" type="password" inputmode="numeric" maxlength="6" placeholder="Nhập PIN...">
  <button id="pinBtn">Tiếp tục</button>
  <div id="pinMsg"></div>
</div>

<!-- ===== GIAO DIỆN CHÍNH ===== -->
<header>
  <div class="brand">
    <h1>NCB AI_SOS 1.0</h1>
    <span>Admin: Nguyễn Công Bằng · <a href="https://ncb-ai.vercel.app/" target="_blank" rel="noopener">ncb-ai.vercel.app</a></span>
  </div>
  <div class="header-controls">
    <button class="hbtn" id="changePinBtn">Đổi PIN</button>
    <button class="hbtn" id="clearBtn">Xóa chat</button>
  </div>
</header>

<div id="chat"></div>

<div id="inputBar">
  <select id="moodSelect" title="Chọn phong cách trả lời">
    <option value="Mặc định">Mặc định</option>
    <option value="Thân thiện">Thân thiện</option>
    <option value="Chuyên nghiệp">Chuyên nghiệp</option>
    <option value="Hài hước">Hài hước</option>
    <option value="Ngắn gọn">Ngắn gọn</option>
  </select>
  <textarea id="input" rows="1" placeholder="Nhập tin nhắn... (Enter gửi, Shift+Enter xuống dòng)"></textarea>
  <button id="sendBtn">Gửi</button>
</div>

<footer>NCB AI_SOS 1.0 · Admin Nguyễn Công Bằng · Hỗ trợ: <a href="https://ncb-ai.vercel.app/" target="_blank" rel="noopener">https://ncb-ai.vercel.app/</a></footer>

<script>
/* ================== CẤU HÌNH ================== */
const API_KEY = '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'.trim();
const API_URL = 'https://api.groq.com/openai/v1/chat/completions';
const MODEL   = 'llama-3.3-70b-versatile';
const SYSTEM  = 'Bạn là NCB AI_SOS 1.0, trợ lý AI của anh Nguyễn Công Bằng (admin website https://ncb-ai.vercel.app/). Trả lời bằng tiếng Việt, ngắn gọn, chính xác, thân thiện. Nếu được hỏi về website, hãy giới thiệu NCB AI_SOS 1.0 và liên kết https://ncb-ai.vercel.app/.';

/* ================== PIN GATE ================== */
const PIN_KEY = 'ncb_ai_pin';
const CHAT_KEY = 'ncb_ai_chat';
const pinGate = document.getElementById('pinGate');
const pinInput = document.getElementById('pinInput');
const pinBtn = document.getElementById('pinBtn');
const pinMsg = document.getElementById('pinMsg');

function getStoredPin() {
  return localStorage.getItem(PIN_KEY);
}
function setPinMsg(t, ok=false) {
  pinMsg.textContent = t;
  pinMsg.style.color = ok ? '#8ab4f8' : '#ff9b9b';
}
pinBtn.addEventListener('click', () => {
  const v = pinInput.value.trim();
  if (!/^\d{6}$/.test(v)) { setPinMsg('PIN phải gồm đúng 6 chữ số.'); return; }
  const stored = getStoredPin();
  if (!stored) {
    localStorage.setItem(PIN_KEY, v);
    setPinMsg('Đã đặt PIN thành công. Đang mở...', true);
    setTimeout(openChat, 500);
  } else {
    if (v === stored) {
      setPinMsg('PIN đúng. Đang mở...', true);
      setTimeout(openChat, 300);
    } else {
      setPinMsg('PIN sai. Thử lại.');
      pinInput.value = '';
    }
  }
});
pinInput.addEventListener('keydown', e => { if (e.key === 'Enter') pinBtn.click(); });

function openChat() {
  pinGate.style.display = 'none';
  loadChat();
  inputEl.focus();
}

/* ================== CHAT ================== */
const chatEl   = document.getElementById('chat');
const inputEl  = document.getElementById('input');
const sendBtn  = document.getElementById('sendBtn');
const clearBtn = document.getElementById('clearBtn');
const changePinBtn = document.getElementById('changePinBtn');
const moodSelect = document.getElementById('moodSelect');

let chatHistory = [];

function saveChat() {
  try { localStorage.setItem(CHAT_KEY, JSON.stringify(chatHistory)); } catch {}
}
function loadChat() {
  try {
    const raw = localStorage.getItem(CHAT_KEY);
    if (raw) {
      chatHistory = JSON.parse(raw) || [];
      chatHistory.forEach(m => addMsg(m.content, m.role === 'user' ? 'user' : 'bot', m.role === 'assistant'));
      return;
    }
  } catch {}
  addMsg('Xin chào! Tôi là NCB AI_SOS 1.0 — trợ lý AI của anh Nguyễn Công Bằng. Hãy nhập câu hỏi.', 'bot', true);
}

function addMsg(text, role, speech=false) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  if (role === 'bot' && speech) {
    const b = document.createElement('button');
    b.className = 'speak-btn';
    b.textContent = '🔊 Đọc';
    b.onclick = () => speak(text);
    d.appendChild(document.createElement('br'));
    d.appendChild(b);
  }
  chatEl.appendChild(d);
  chatEl.scrollTop = chatEl.scrollHeight;
  return d;
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'vi-VN';
  const v = speechSynthesis.getVoices().find(x => x.lang.startsWith('vi'));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendBtn.disabled = true;

  addMsg(text, 'user');
  const typing = document.createElement('div');
  typing.className = 'msg bot typing';
  typing.textContent = 'NCB AI_SOS 1.0 đang trả lời...';
  chatEl.appendChild(typing);
  chatEl.scrollTop = chatEl.scrollHeight;

  chatHistory.push({ role: 'user', content: text });
  saveChat();

  try {
    const mood = moodSelect.value;
    let systemPrompt = SYSTEM;
    if (mood && mood !== 'Mặc định') systemPrompt += ` Hãy trả lời với phong cách ${mood.toLowerCase()}.`;

    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + API_KEY
      },
      body: JSON.stringify({
        model: MODEL,
        messages: [{ role: 'system', content: systemPrompt }, ...chatHistory],
        temperature: 0.7,
        max_tokens: 2048
      })
    });

    const raw = await res.text();
    if (!res.ok) throw new Error('HTTP ' + res.status + ' → ' + raw.slice(0, 400));

    let data;
    try { data = JSON.parse(raw); } catch { throw new Error('Phản hồi không phải JSON: ' + raw.slice(0, 200)); }

    const reply = data?.choices?.[0]?.message?.content?.trim();
    if (!reply) throw new Error('Không có nội dung trả về.');

    typing.remove();
    chatHistory.push({ role: 'assistant', content: reply });
    saveChat();
    addMsg(reply, 'bot', true);

  } catch (e) {
    typing.remove();
    addMsg('Lỗi: ' + e.message, 'error');
    chatHistory.pop();
    saveChat();
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.onclick = send;
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
});

clearBtn.onclick = () => {
  if (!confirm('Xóa toàn bộ hội thoại?')) return;
  chatHistory = [];
  localStorage.removeItem(CHAT_KEY);
  chatEl.innerHTML = '';
  addMsg('Hội thoại đã được xóa. Bắt đầu cuộc trò chuyện mới.', 'bot');
};

changePinBtn.onclick = () => {
  const oldPin = prompt('Nhập PIN hiện tại:');
  if (oldPin !== getStoredPin()) { alert('PIN hiện tại không đúng.'); return; }
  const newPin = prompt('Nhập PIN mới (6 chữ số):');
  if (!/^\d{6}$/.test(newPin || '')) { alert('PIN mới phải gồm đúng 6 chữ số.'); return; }
  localStorage.setItem(PIN_KEY, newPin);
  alert('Đã đổi PIN thành công.');
};

if ('speechSynthesis' in window) speechSynthesis.getVoices();
</script>
</body>
</html>
