<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBĐ AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: #0f0f12;
            color: #e6e6e6;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 14px 20px;
            background: #17171c;
            border-bottom: 1px solid #2a2a33;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        header h1 { font-size: 16px; font-weight: 600; color: #8ab4f8; }
        .header-controls { display: flex; gap: 10px; align-items: center; }
        #clearBtn {
            background: transparent;
            border: 1px solid #444;
            color: #bbb;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
        }
        #clearBtn:hover { border-color: #8ab4f8; color: #8ab4f8; }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .msg {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 14px;
            white-space: pre-wrap;
            word-wrap: break-word;
            position: relative;
        }
        .user {
            align-self: flex-end;
            background: #1f3a5f;
            color: #dbeafe;
            border-bottom-right-radius: 3px;
        }
        .bot {
            align-self: flex-start;
            background: #1e1e26;
            color: #e6e6e6;
            border-bottom-left-radius: 3px;
        }
        .error {
            align-self: flex-start;
            background: #3a1f1f;
            color: #ff9b9b;
            border-bottom-left-radius: 3px;
        }
        .typing { color: #888; font-style: italic; font-size: 13px; }

        .speak-btn {
            background: transparent;
            border: 1px solid #3a3a44;
            color: #8ab4f8;
            border-radius: 4px;
            padding: 3px 8px;
            font-size: 11px;
            cursor: pointer;
            margin-top: 8px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .speak-btn:hover { background: #2a2a33; }

        #inputBar {
            display: flex;
            gap: 10px;
            padding: 14px 20px;
            background: #17171c;
            border-top: 1px solid #2a2a33;
            align-items: flex-end;
        }
        #moodSelect {
            padding: 12px 10px;
            background: #0f0f12;
            border: 1px solid #333;
            border-radius: 8px;
            color: #e6e6e6;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            cursor: pointer;
            min-width: 110px;
        }
        #moodSelect:focus { border-color: #8ab4f8; }
        #input {
            flex: 1;
            padding: 12px 14px;
            background: #0f0f12;
            border: 1px solid #333;
            border-radius: 8px;
            color: #e6e6e6;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            outline: none;
            min-height: 44px;
            max-height: 140px;
        }
        #input:focus { border-color: #8ab4f8; }
        #sendBtn {
            padding: 0 22px;
            height: 44px;
            background: #8ab4f8;
            color: #0f0f12;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            font-family: inherit;
        }
        #sendBtn:disabled { background: #444; color: #888; cursor: not-allowed; }
    </style>
</head>
<body>
    <header>
        <h1>PBĐ AI</h1>
        <div class="header-controls">
            <button id="clearBtn">Xóa hội thoại</button>
        </div>
    </header>

    <div id="chat"></div>

    <div id="inputBar">
        <select id="moodSelect" title="Chọn phong cách trả lời">
            <option value="Mặc định">Mặc định</option>
            <option value="Thân thiện">Thân thiện</option>
            <option value="Chuyên nghiệp">Chuyên nghiệp</option>
            <option value="Hài hước">Hài hước</option>
            <option value="Ngắn gọn">Ngắn gọn</option>
        </select>
        <textarea id="input" rows="1" placeholder="Nhập tin nhắn... (Enter để gửi, Shift+Enter xuống dòng)"></textarea>
        <button id="sendBtn">Gửi</button>
    </div>

    <script>
        // ===== CẤU HÌNH =====
        const API_KEY = 'AQ.Ab8RN6KP1ORt7EgzeoQjunf8f1gTii9-cThXUN-5Et1qrF66Ew'.trim();
        const API_HOST = 'https://generativelanguage.googleapis.com/v1beta';

        // Danh sách model ưu tiên (đã cập nhật theo yêu cầu)
        const MODEL_FALLBACKS = [
            'gemini-3.5-flash-lite',
            'gemini-3.8-flash',
            'gemini-2.5-flash-lite'
        ];

        const BASE_SYSTEM_INSTRUCTION = 'Bạn là PBĐ AI, trợ lý AI hữu ích, trả lời bằng tiếng Việt.';

        // ===== TRẠNG THÁI =====
        let chatHistory = [];
        // Lưu model đã được resolve thành công để tái sử dụng, tránh dò lại mỗi lần gửi
        let resolvedModel = null;

        // ===== DOM =====
        const chatEl   = document.getElementById('chat');
        const inputEl  = document.getElementById('input');
        const sendBtn  = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const moodSelect = document.getElementById('moodSelect');

        // ===== HIỂN THỊ =====
        function addMessage(text, role, allowSpeech = false) {
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            div.textContent = text;

            if (role === 'bot' && allowSpeech) {
                const speakBtn = document.createElement('button');
                speakBtn.className = 'speak-btn';
                speakBtn.innerHTML = '🔊 Đọc';
                speakBtn.title = 'Đọc tin nhắn này bằng tiếng Việt';
                speakBtn.addEventListener('click', () => speakText(text));
                div.appendChild(document.createElement('br'));
                div.appendChild(speakBtn);
            }

            chatEl.appendChild(div);
            chatEl.scrollTop = chatEl.scrollHeight;
            return div;
        }

        function addTyping() {
            const div = document.createElement('div');
            div.className = 'msg bot typing';
            div.textContent = 'PBĐ AI đang trả lời...';
            chatEl.appendChild(div);
            chatEl.scrollTop = chatEl.scrollHeight;
            return div;
        }

        // ===== ĐỌC GIỌNG NÓI =====
        function speakText(text) {
            if (!('speechSynthesis' in window)) {
                alert('Trình duyệt của bạn không hỗ trợ đọc văn bản.');
                return;
            }
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'vi-VN';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            const voices = window.speechSynthesis.getVoices();
            const viVoice = voices.find(v => v.lang === 'vi-VN' || v.lang.startsWith('vi'));
            if (viVoice) utterance.voice = viVoice;
            window.speechSynthesis.speak(utterance);
        }

        // ===== GỌI GENERATE CONTENT VỚI MỘT MODEL CỤ THỂ =====
        async function callGenerateContent(model, body) {
            const endpoint = `${API_HOST}/models/${model}:generateContent`;
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-goog-api-key': API_KEY
                },
                body: JSON.stringify(body)
            });

            if (res.status === 404) {
                const errText = await res.text();
                const err = new Error(`HTTP 404: ${errText.slice(0, 200)}`);
                err.status = 404;
                throw err;
            }

            if (!res.ok) {
                const errText = await res.text();
                const err = new Error(`HTTP ${res.status}: ${errText.slice(0, 300)}`);
                err.status = res.status;
                throw err;
            }

            return res.json();
        }

        // ===== DÒ MODEL KHẢ DỤNG QUA GET /v1beta/models =====
        async function discoverModel() {
            const res = await fetch(`${API_HOST}/models`, {
                method: 'GET',
                headers: { 'x-goog-api-key': API_KEY }
            });

            if (!res.ok) {
                const errText = await res.text();
                throw new Error(`Không thể lấy danh sách model (HTTP ${res.status}): ${errText.slice(0, 200)}`);
            }

            const data = await res.json();
            const models = data.models || [];

            // Tìm model đầu tiên hỗ trợ generateContent
            const candidate = models.find(m => {
                const methods = m.supportedGenerationMethods || m.supported_generation_methods || [];
                return methods.includes('generateContent');
            });

            if (!candidate) {
                throw new Error('Không tìm thấy model nào hỗ trợ generateContent trong danh sách trả về.');
            }

            // Tên model có thể có tiền tố "models/", cần bỏ đi khi gọi endpoint
            return candidate.name.replace(/^models\//, '');
        }

        // ===== GỬI TIN NHẮN TỚI GEMINI =====
        async function sendToGemini(userText) {
            // 1. Thêm tin nhắn user vào lịch sử
            chatHistory.push({
                role: 'user',
                parts: [{ text: userText }]
            });

            // 2. Xây dựng system instruction dựa trên Mood
            const mood = moodSelect.value;
            let systemInstruction = BASE_SYSTEM_INSTRUCTION;
            if (mood && mood !== 'Mặc định') {
                systemInstruction += ` Hãy trả lời với phong cách ${mood.toLowerCase()}.`;
            }

            const body = {
                system_instruction: { parts: [{ text: systemInstruction }] },
                contents: chatHistory
            };

            let lastError = null;

            // 3. Nếu đã có model resolve thành công trước đó, thử lại model đó trước
            const modelsToTry = resolvedModel
                ? [resolvedModel, ...MODEL_FALLBACKS.filter(m => m !== resolvedModel)]
                : [...MODEL_FALLBACKS];

            for (const model of modelsToTry) {
                try {
                    const data = await callGenerateContent(model, body);
                    const candidate = data.candidates && data.candidates[0];
                    const parts = candidate && candidate.content && candidate.content.parts;
                    const reply = parts && parts.map(p => p.text || '').join('').trim();

                    if (!reply) {
                        throw new Error('Phản hồi rỗng hoặc bị chặn: ' + JSON.stringify(data).slice(0, 300));
                    }

                    // Lưu model thành công để tái sử dụng
                    resolvedModel = model;

                    chatHistory.push({
                        role: 'model',
                        parts: [{ text: reply }]
                    });

                    return reply;

                } catch (err) {
                    lastError = err;
                    // Nếu là lỗi 404, tiếp tục thử model kế tiếp trong danh sách
                    if (err.status === 404) {
                        console.warn(`Model ${model} trả 404, thử model tiếp theo...`);
                        continue;
                    }
                    // Các lỗi khác (401, 403, 429, 500) vẫn tiếp tục thử model sau
                    // để tăng khả năng thành công nếu lỗi chỉ mang tính tạm thời
                }
            }

            // 4. Tất cả model ưu tiên đều thất bại → dò model khả dụng qua GET /models
            console.warn('Tất cả model ưu tiên thất bại, đang dò model khả dụng...');
            try {
                const discovered = await discoverModel();
                console.log(`Model được phát hiện: ${discovered}`);

                const data = await callGenerateContent(discovered, body);
                const candidate = data.candidates && data.candidates[0];
                const parts = candidate && candidate.content && candidate.content.parts;
                const reply = parts && parts.map(p => p.text || '').join('').trim();

                if (!reply) {
                    throw new Error('Phản hồi rỗng hoặc bị chặn: ' + JSON.stringify(data).slice(0, 300));
                }

                resolvedModel = discovered;

                chatHistory.push({
                    role: 'model',
                    parts: [{ text: reply }]
                });

                return reply;

            } catch (discoverErr) {
                lastError = discoverErr;
            }

            throw lastError || new Error('Tất cả các model và cơ chế dò model đều thất bại.');
        }

        // ===== XỬ LÝ GỬI =====
        async function handleSend() {
            const text = inputEl.value.trim();
            if (!text) return;

            inputEl.value = '';
            inputEl.style.height = 'auto';
            sendBtn.disabled = true;

            addMessage(text, 'user');
            const typingEl = addTyping();

            try {
                const reply = await sendToGemini(text);
                typingEl.remove();
                addMessage(reply, 'bot', true);
            } catch (err) {
                typingEl.remove();
                addMessage('Lỗi: ' + err.message, 'error');
                chatHistory.pop();
            } finally {
                sendBtn.disabled = false;
                inputEl.focus();
            }
        }

        // ===== SỰ KIỆN =====
        sendBtn.addEventListener('click', handleSend);

        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });

        inputEl.addEventListener('input', () => {
            inputEl.style.height = 'auto';
            inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
        });

        clearBtn.addEventListener('click', () => {
            chatHistory = [];
            resolvedModel = null;
            chatEl.innerHTML = '';
            addMessage('Hội thoại đã được xóa. Bắt đầu cuộc trò chuyện mới.', 'bot');
        });

        // ===== KHỞI TẠO =====
        if ('speechSynthesis' in window) {
            window.speechSynthesis.getVoices();
        }
        addMessage('Xin chào! Tôi là PBĐ AI. Hãy nhập câu hỏi.', 'bot', true);
    </script>
</body>
</html>
