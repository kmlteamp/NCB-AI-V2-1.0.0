<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBĐ AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: #0f0f12;
            color: #e6e6e6;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 14px 20px;
            background: #17171c;
            border-bottom: 1px solid #2a2a33;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        header h1 { font-size: 16px; font-weight: 600; color: #f55036; }
        .header-controls { display: flex; gap: 10px; align-items: center; }
        #clearBtn {
            background: transparent;
            border: 1px solid #444;
            color: #bbb;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
        }
        #clearBtn:hover { border-color: #f55036; color: #f55036; }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .msg {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 14px;
            white-space: pre-wrap;
            word-wrap: break-word;
            position: relative;
        }
        .user {
            align-self: flex-end;
            background: #1f3a5f;
            color: #dbeafe;
            border-bottom-right-radius: 3px;
        }
        .bot {
            align-self: flex-start;
            background: #1e1e26;
            color: #e6e6e6;
            border-bottom-left-radius: 3px;
        }
        .error {
            align-self: flex-start;
            background: #3a1f1f;
            color: #ff9b9b;
            border-bottom-left-radius: 3px;
        }
        .typing { color: #888; font-style: italic; font-size: 13px; }

        .speak-btn {
            background: transparent;
            border: 1px solid #3a3a44;
            color: #f55036;
            border-radius: 4px;
            padding: 3px 8px;
            font-size: 11px;
            cursor: pointer;
            margin-top: 8px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .speak-btn:hover { background: #2a2a33; }

        #inputBar {
            display: flex;
            gap: 10px;
            padding: 14px 20px;
            background: #17171c;
            border-top: 1px solid #2a2a33;
            align-items: flex-end;
        }
        #moodSelect {
            padding: 12px 10px;
            background: #0f0f12;
            border: 1px solid #333;
            border-radius: 8px;
            color: #e6e6e6;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            cursor: pointer;
            min-width: 110px;
        }
        #moodSelect:focus { border-color: #f55036; }
        #input {
            flex: 1;
            padding: 12px 14px;
            background: #0f0f12;
            border: 1px solid #333;
            border-radius: 8px;
            color: #e6e6e6;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            outline: none;
            min-height: 44px;
            max-height: 140px;
        }
        #input:focus { border-color: #f55036; }
        #sendBtn {
            padding: 0 22px;
            height: 44px;
            background: #f55036;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            font-family: inherit;
        }
        #sendBtn:disabled { background: #444; color: #888; cursor: not-allowed; }
    </style>
</head>
<body>
    <header>
        <h1>PBĐ AI</h1>
        <div class="header-controls">
            <button id="clearBtn">Xóa hội thoại</button>
        </div>
    </header>

    <div id="chat"></div>

    <div id="inputBar">
        <select id="moodSelect" title="Chọn phong cách trả lời">
            <option value="Mặc định">Mặc định</option>
            <option value="Thân thiện">Thân thiện</option>
            <option value="Chuyên nghiệp">Chuyên nghiệp</option>
            <option value="Hài hước">Hài hước</option>
            <option value="Ngắn gọn">Ngắn gọn</option>
        </select>
        <textarea id="input" rows="1" placeholder="Nhập tin nhắn... (Enter để gửi, Shift+Enter xuống dòng)"></textarea>
        <button id="sendBtn">Gửi</button>
    </div>

    <script>
        // ===== CẤU HÌNH GROQ =====
        const API_KEY = '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'.trim();
        const API_URL = 'https://api.groq.com/openai/v1/chat/completions';

        // Model chính: Llama 3.3 70B Versatile (ID chính xác trên Groq)
        const PRIMARY_MODEL = 'llama-3.3-70b-versatile';

        // Danh sách dự phòng nếu model chính lỗi (model bị gỡ / quá tải)
        const MODEL_FALLBACKS = [
            PRIMARY_MODEL,
            'llama-3.1-8b-instant',
            'gemma2-9b-it'
        ];

        const BASE_SYSTEM = 'Bạn là PBĐ AI, trợ lý AI hữu ích, trả lời bằng tiếng Việt.';

        // ===== TRẠNG THÁI =====
        let chatHistory = [];
        let resolvedModel = null; // Ghi nhớ model đã hoạt động

        // ===== DOM =====
        const chatEl   = document.getElementById('chat');
        const inputEl  = document.getElementById('input');
        const sendBtn  = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const moodSelect = document.getElementById('moodSelect');

        // ===== HIỂN THỊ =====
        function addMessage(text, role, allowSpeech = false) {
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            div.textContent = text;

            if (role === 'bot' && allowSpeech) {
                const speakBtn = document.createElement('button');
                speakBtn.className = 'speak-btn';
                speakBtn.innerHTML = '🔊 Đọc';
                speakBtn.title = 'Đọc tin nhắn này bằng tiếng Việt';
                speakBtn.addEventListener('click', () => speakText(text));
                div.appendChild(document.createElement('br'));
                div.appendChild(speakBtn);
            }

            chatEl.appendChild(div);
            chatEl.scrollTop = chatEl.scrollHeight;
            return div;
        }

        function addTyping() {
            const div = document.createElement('div');
            div.className = 'msg bot typing';
            div.textContent = 'PBĐ AI đang trả lời...';
            chatEl.appendChild(div);
            chatEl.scrollTop = chatEl.scrollHeight;
            return div;
        }

        // ===== ĐỌC GIỌNG NÓI =====
        function speakText(text) {
            if (!('speechSynthesis' in window)) {
                alert('Trình duyệt của bạn không hỗ trợ đọc văn bản.');
                return;
            }
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'vi-VN';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            const voices = window.speechSynthesis.getVoices();
            const viVoice = voices.find(v => v.lang === 'vi-VN' || v.lang.startsWith('vi'));
            if (viVoice) utterance.voice = viVoice;
            window.speechSynthesis.speak(utterance);
        }

        // ===== GỌI GROQ VỚI MỘT MODEL CỤ THỂ =====
        async function callGroq(model, messages) {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: model,
                    messages: messages,
                    temperature: 0.7,
                    max_tokens: 4096 // Giới hạn output hợp lý, tránh tràn context
                })
            });

            if (!res.ok) {
                const errText = await res.text();
                const err = new Error(`HTTP ${res.status}: ${errText.slice(0, 300)}`);
                err.status = res.status;
                throw err;
            }

            return res.json();
        }

        // ===== DÒ MODEL KHẢ DỤNG QUA GET /openai/v1/models =====
        async function discoverModel() {
            const res = await fetch('https://api.groq.com/openai/v1/models', {
                method: 'GET',
                headers: { 'Authorization': `Bearer ${API_KEY}` }
            });

            if (!res.ok) {
                const errText = await res.text();
                throw new Error(`Không lấy được danh sách model (HTTP ${res.status}): ${errText.slice(0, 200)}`);
            }

            const data = await res.json();
            const models = data.data || [];

            // Ưu tiên các model chat phổ biến còn hoạt động
            const preferred = models.find(m =>
                m.id.includes('llama-3.3-70b') ||
                m.id.includes('llama-3.1-8b') ||
                m.id.includes('gemma2') ||
                m.id.includes('qwen')
            );

            if (!preferred && models.length === 0) {
                throw new Error('Không có model nào khả dụng cho key này.');
            }

            return (preferred || models[0]).id;
        }

        // ===== GỬI TIN NHẮN =====
        async function sendToGroq(userText) {
            chatHistory.push({ role: 'user', content: userText });

            const mood = moodSelect.value;
            let systemPrompt = BASE_SYSTEM;
            if (mood && mood !== 'Mặc định') {
                systemPrompt += ` Hãy trả lời với phong cách ${mood.toLowerCase()}.`;
            }

            const messages = [
                { role: 'system', content: systemPrompt },
                ...chatHistory
            ];

            let lastError = null;

            const modelsToTry = resolvedModel
                ? [resolvedModel, ...MODEL_FALLBACKS.filter(m => m !== resolvedModel)]
                : [...MODEL_FALLBACKS];

            for (const model of modelsToTry) {
                try {
                    const data = await callGroq(model, messages);
                    const reply = data.choices && data.choices[0] && data.choices[0].message
                        ? data.choices[0].message.content.trim()
                        : '';

                    if (!reply) throw new Error('Phản hồi rỗng.');

                    resolvedModel = model;
                    chatHistory.push({ role: 'assistant', content: reply });
                    return reply;

                } catch (err) {
                    lastError = err;
                    // 400/404: model sai hoặc bị gỡ → thử model kế tiếp
                    if (err.status === 400 || err.status === 404) {
                        console.warn(`Model ${model} lỗi ${err.status}, thử model tiếp theo...`);
                        continue;
                    }
                    // 401/403/429: lỗi auth/quota → dừng ngay
                    if (err.status === 401 || err.status === 403) {
                        throw err;
                    }
                }
            }

            // Tất cả model ưu tiên thất bại → dò model khả dụng
            console.warn('Tất cả model ưu tiên thất bại, đang dò model...');
            try {
                const discovered = await discoverModel();
                console.log(`Model phát hiện: ${discovered}`);

                const data = await callGroq(discovered, messages);
                const reply = data.choices && data.choices[0] && data.choices[0].message
                    ? data.choices[0].message.content.trim()
                    : '';

                if (!reply) throw new Error('Phản hồi rỗng.');

                resolvedModel = discovered;
                chatHistory.push({ role: 'assistant', content: reply });
                return reply;

            } catch (discoverErr) {
                lastError = discoverErr;
            }

            throw lastError || new Error('Tất cả model đều thất bại.');
        }

        // ===== XỬ LÝ GỬI =====
        async function handleSend() {
            const text = inputEl.value.trim();
            if (!text) return;

            inputEl.value = '';
            inputEl.style.height = 'auto';
            sendBtn.disabled = true;

            addMessage(text, 'user');
            const typingEl = addTyping();

            try {
                const reply = await sendToGroq(text);
                typingEl.remove();
                addMessage(reply, 'bot', true);
            } catch (err) {
                typingEl.remove();
                addMessage('Lỗi: ' + err.message, 'error');
                chatHistory.pop();
            } finally {
                sendBtn.disabled = false;
                inputEl.focus();
            }
        }

        // ===== SỰ KIỆN =====
        sendBtn.addEventListener('click', handleSend);

        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });

        inputEl.addEventListener('input', () => {
            inputEl.style.height = 'auto';
            inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
        });

        clearBtn.addEventListener('click', () => {
            chatHistory = [];
            resolvedModel = null;
            chatEl.innerHTML = '';
            addMessage('Hội thoại đã được xóa. Bắt đầu cuộc trò chuyện mới.', 'bot');
        });

        // ===== KHỞI TẠO =====
        if ('speechSynthesis' in window) {
            window.speechSynthesis.getVoices();
        }
        addMessage('Xin chào! Tôi là PBĐ AI (Llama 3.3 70B). Hãy nhập câu hỏi.', 'bot', true);
    </script>
</body>
</html>
