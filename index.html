<!DOCTYPE html>
<!-- Chatbot Gemini — đã thay API key mới.
     Endpoint đúng: generativelanguage.googleapis.com -->
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Chatbot</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: #0f0f12;
            color: #e6e6e6;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 14px 20px;
            background: #17171c;
            border-bottom: 1px solid #2a2a33;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 { font-size: 16px; font-weight: 600; color: #8ab4f8; }
        #clearBtn {
            background: transparent;
            border: 1px solid #444;
            color: #bbb;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        #clearBtn:hover { border-color: #8ab4f8; color: #8ab4f8; }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .msg {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 14px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .user {
            align-self: flex-end;
            background: #1f3a5f;
            color: #dbeafe;
            border-bottom-right-radius: 3px;
        }
        .bot {
            align-self: flex-start;
            background: #1e1e26;
            color: #e6e6e6;
            border-bottom-left-radius: 3px;
        }
        .error {
            align-self: flex-start;
            background: #3a1f1f;
            color: #ff9b9b;
            border-bottom-left-radius: 3px;
        }
        .typing { color: #888; font-style: italic; font-size: 13px; }

        #inputBar {
            display: flex;
            gap: 10px;
            padding: 14px 20px;
            background: #17171c;
            border-top: 1px solid #2a2a33;
        }
        #input {
            flex: 1;
            padding: 12px 14px;
            background: #0f0f12;
            border: 1px solid #333;
            border-radius: 8px;
            color: #e6e6e6;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            outline: none;
        }
        #input:focus { border-color: #8ab4f8; }
        #sendBtn {
            padding: 0 22px;
            background: #8ab4f8;
            color: #0f0f12;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }
        #sendBtn:disabled { background: #444; color: #888; cursor: not-allowed; }
    </style>
</head>
<body>
    <header>
        <h1>Gemini Chatbot</h1>
        <button id="clearBtn">Xóa hội thoại</button>
    </header>

    <div id="chat"></div>

    <div id="inputBar">
        <textarea id="input" rows="1" placeholder="Nhập tin nhắn... (Enter để gửi, Shift+Enter xuống dòng)"></textarea>
        <button id="sendBtn">Gửi</button>
    </div>

    <script>
        // ===== CẤU HÌNH =====
        // Khóa API mới (dạng AQ.* — Google AI Studio key)
        const API_KEY = 'AQ.AQ.Ab8RN6LUdZXZS-PmAOR_ecqQp2LbnaDP4HP1kMYmjTfkfGzQHg';

        // Endpoint đúng của Gemini API
        const ENDPOINT = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent';

        // Chỉ thị hệ thống cho bot
        const SYSTEM_INSTRUCTION = 'Bạn là trợ lý AI hữu ích, trả lời ngắn gọn, chính xác bằng tiếng Việt.';

        // ===== TRẠNG THÁI =====
        let chatHistory = [];

        // ===== DOM =====
        const chatEl  = document.getElementById('chat');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');

        // ===== HIỂN THỊ =====
        function addMessage(text, role) {
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            div.textContent = text;
            chatEl.appendChild(div);
            chatEl.scrollTop = chatEl.scrollHeight;
            return div;
        }

        function addTyping() {
            const div = document.createElement('div');
            div.className = 'msg bot typing';
            div.textContent = 'Đang trả lời...';
            chatEl.appendChild(div);
            chatEl.scrollTop = chatEl.scrollHeight;
            return div;
        }

        // ===== GỌI API =====
        async function sendToGemini(userText) {
            chatHistory.push({
                role: 'user',
                parts: [{ text: userText }]
            });

            const body = {
                system_instruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
                contents: chatHistory
            };

            const res = await fetch(ENDPOINT, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-goog-api-key': API_KEY
                },
                body: JSON.stringify(body)
            });

            if (!res.ok) {
                const errText = await res.text();
                throw new Error(`HTTP ${res.status}: ${errText.slice(0, 300)}`);
            }

            const data = await res.json();
            const candidate = data.candidates && data.candidates[0];
            const parts = candidate && candidate.content && candidate.content.parts;
            const reply = parts && parts.map(p => p.text || '').join('').trim();

            if (!reply) {
                throw new Error('Phản hồi rỗng hoặc bị chặn: ' + JSON.stringify(data).slice(0, 300));
            }

            chatHistory.push({
                role: 'model',
                parts: [{ text: reply }]
            });

            return reply;
        }

        // ===== GỬI =====
        async function handleSend() {
            const text = inputEl.value.trim();
            if (!text) return;

            inputEl.value = '';
            inputEl.style.height = 'auto';
            sendBtn.disabled = true;

            addMessage(text, 'user');
            const typingEl = addTyping();

            try {
                const reply = await sendToGemini(text);
                typingEl.remove();
                addMessage(reply, 'bot');
            } catch (err) {
                typingEl.remove();
                addMessage('Lỗi: ' + err.message, 'error');
                chatHistory.pop();
            } finally {
                sendBtn.disabled = false;
                inputEl.focus();
            }
        }

        // ===== SỰ KIỆN =====
        sendBtn.addEventListener('click', handleSend);

        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });

        inputEl.addEventListener('input', () => {
            inputEl.style.height = 'auto';
            inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
        });

        clearBtn.addEventListener('click', () => {
            chatHistory = [];
            chatEl.innerHTML = '';
            addMessage('Hội thoại đã được xóa. Bắt đầu cuộc trò chuyện mới.', 'bot');
        });

        addMessage('Xin chào! Tôi là chatbot Gemini. Hãy nhập câu hỏi.', 'bot');
    </script>
</body>
</html>
